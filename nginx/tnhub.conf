# tnhub.kr nginx 사이트 설정
# Jenkins 배포 시 /etc/nginx/sites-available/default 로 자동 설치됨 (백업 → nginx -t → 실패 시 자동 복구)
# 서버에서 직접 수정하면 다음 배포 때 덮어써지므로, 이 파일을 수정해서 배포할 것

# HTTP -> HTTPS 리디렉션
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name tnhub.kr www.tnhub.kr;

    # Let's Encrypt 인증용
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

# HTTPS 설정
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    server_name tnhub.kr www.tnhub.kr;

    # SSL 인증서 경로 (Certbot이 관리)
    ssl_certificate /etc/letsencrypt/live/tnhub.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tnhub.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 기본 보안 헤더
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 프론트엔드 파일 경로
    root /var/www/html;
    index index.html;

    # 1. React SPA 라우팅 (새로고침 404 방지)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html은 캐시하지 않음 → 배포 직후에도 최신 화면 (/assets/* 는 해시 파일명이라 캐시 안전)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 2. 백엔드 API 프록시 (관리자 API도 /api/admin/** 로 여기 포함)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 게시판 파일 업로드 (/api/uploadAjax)
        client_max_body_size 1024M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 3. OAuth2 로그인 시작
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. 로그인: 페이지(GET)는 React, 로그인 요청(POST)만 백엔드
    location = /login {
        error_page 418 = @backend;
        if ($request_method = POST) {
            return 418;
        }
        try_files /index.html =404;
    }

    # OAuth2 콜백(/login/oauth2/code/*) 및 로그아웃
    location ~ ^/(login/oauth2/|logout) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @backend {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. WebSocket (채팅, 실시간 시세, 온라인 장기) - /ws-chat 과 /ws-chat/** 모두 처리
    location /ws-chat {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    if ($host = www.tnhub.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = tnhub.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 ;
    listen [::]:80 ;
    server_name www.tnhub.kr tnhub.kr;
    return 404; # managed by Certbot
}
